version: "3.7"

# Same image + run.sh Docker mode as the README's compose (--lan --web, UI on :8930, self-update into /data).
# Host network like Umbrel's home-assistant app — no app_proxy: the Core must see the LAN (mDNS, SSDP) to find DAPs and
# speakers, and Umbrel's proxy cannot route to a host-network service. Its own browser pairing guards the page.
# ponytail: amd64-only image (no arm64 index entry yet) — Umbrel's official store needs both; fine for a community store.
services:
  server:
    image: ghcr.io/tekchansin/infinity-core:14.0-beta18@sha256:6354735d842d77c2749dc289aa1a5e968e768ceb845ee3d64e513feca83b88cf
    network_mode: host
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data                            # library, settings, updates (removed with the app)
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music    # Music Library's default (umbrel-app.yml folderAccess);
                                                              # rw: the tag editor, music copied from a DAP
      # a DAC on the box (core/audio_out_alsa.cpp: ALSA hw:, bit-perfect, native DSD) — the directory, not `devices:`, so
      # a box with no sound card still starts and a DAC plugged in later shows up; the rule lets ALSA's nodes open.
      # No /proc/asound or systempaths=unconfined: the Core finds cards through /dev/snd and sysfs (masked /proc is fine)
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 116:* rwm"  # ALSA (major 116)
