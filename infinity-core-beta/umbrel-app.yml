manifestVersion: 1.1
id: infinity-core-beta
folderAccess:
  - id: music-library
    name: Music Library
    note: >-
      The folder with your music: Infinity Core plays it as your library, and writes to it when you edit tags or copy
      music from a DAP. Until you pick one: Files › Downloads › music.
    mounts:
      - service: server
        targetPath: /music
        readOnly: false
environment:
  - name: INFINITY_NAME
    services:
      - server
    note: How DAPs, phones and speakers name this Infinity Core ("Playing from …"). Empty = this Umbrel's own name.
  - name: TZ
    services:
      - server
    default: Etc/UTC
    note: Your time zone, e.g. Asia/Bangkok or Europe/London — for the daily backup and the times Infinity Core shows.
category: media
name: Infinity Core (beta)
version: "14.0-beta31"
tagline: Your music library, Qobuz and TIDAL on your Infinity DAP and speakers
icon: https://raw.githubusercontent.com/tekchansin/Infinity-Umbrel/main/infinity-core-beta/icon.png
description: >-
  Your music library, Qobuz and TIDAL — played on your Infinity DAP, AirPlay, Google Cast or UPnP speakers, or on a
  USB DAC plugged into your Umbrel. Your library is the music in Files › Downloads › music, or another folder you pick:
  right-click the app › Settings › Music Library.


  The first time you open it, press Start using Infinity Core. Other browsers and apps pair with a six-digit code,
  shown in a browser that is already paired (Settings › Devices & Sharing) or in this app's logs (right-click the
  app › Settings › View logs).
releaseNotes: >-
  Extensions: programs and web sources add lyrics, album and artist information, covers, radio stations and menu items
  to Infinity Core, once you enable them in Settings › Extensions. Home Assistant shows each zone as a media player
  (the Infinity Core integration, HACS). Faster artist and album pages; tidier Settings; TIDAL Hi-Res on older UPnP
  streamers.
developer: Anantar Ultimate
website: https://anantarultimate.com
dependencies: []
repo: https://github.com/tekchansin/Infinity-Umbrel
support: https://discord.gg/Z9T8VfshVs
port: 8930
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
submitter: Anantar Ultimate
submission: ""
